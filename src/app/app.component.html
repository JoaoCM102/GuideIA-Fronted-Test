<div
  class="admin-layout"
  [class.sidebar-open]="sidebarOpen"
  data-guideia="demo-page"
  [attr.data-guideia-state]="sidebarOpen ? 'sidebar-open' : 'sidebar-closed'"
  [attr.data-guideia-route]="currentRoute"
>
  <button
    class="mobile-overlay"
    type="button"
    *ngIf="sidebarOpen"
    (click)="toggleSidebar()"
    aria-label="Cerrar menu lateral"
  ></button>

  <aside
    class="sidebar"
    data-guideia="menu-lateral"
    [attr.data-guideia-state]="sidebarOpen ? 'open' : 'closed'"
  >
    <header class="brand">
      <p class="brand-tag">GuideIA Suite</p>
      <h1>{{ title }}</h1>
      <small>Panel operativo contextual</small>
    </header>

    <nav class="menu" data-guideia="top-nav">
      <a
        *ngFor="let item of navigation"
        [routerLink]="item.route"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="closeSidebarOnMobile()"
        [attr.data-guideia]="item.guideSelector"
      >
        <span class="icon">{{ item.icon }}</span>
        <span>{{ item.label }}</span>
      </a>
    </nav>

    <footer class="sidebar-footer">
      <p>Motor IA: Python API</p>
      <small>Widget flotante de la libreria NPM activo</small>
    </footer>
  </aside>

  <main class="workspace">
    <header class="topbar" data-guideia="demo-header">
      <button
        class="menu-toggle"
        type="button"
        (click)="toggleSidebar()"
        data-guideia="menu-hamburguesa"
        aria-label="Abrir o cerrar menu"
        [attr.aria-expanded]="sidebarOpen"
      >
        {{ sidebarOpen ? '✕' : '☰' }}
      </button>
      <div class="topbar-context">
        <p class="label">Modulo activo</p>
        <h2>{{ currentSectionLabel }}</h2>
      </div>
      <div class="topbar-actions">
        <span class="status-dot"></span>
        <span>Entorno local</span>
      </div>
    </header>

    <section
      class="route-wrapper"
      data-guideia="demo-sections"
      [@routeMotion]="prepareRoute(outlet)"
    >
      <router-outlet #outlet="outlet"></router-outlet>
    </section>
  </main>
</div>
